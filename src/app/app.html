<div class="shell" [class.sidebar-open]="sidebarOpen()">
  <header class="shell-header">
    <button
      type="button"
      class="menu-toggle"
      aria-label="Abrir menu"
      (click)="toggleSidebar()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="brand">
      <img class="brand-icon" src="assets/scaliz-logo.jpg" alt="Scaliz" />
    </div>
  </header>

  <aside class="sidebar">
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()">
        <span class="icon" aria-hidden="true">📊</span>
        <span>Dashboard</span>
      </a>
      <a routerLink="/monitoramento" routerLinkActive="active" (click)="closeSidebar()">
        <span class="icon" aria-hidden="true">💲</span>
        <span>Monitoramento</span>
      </a>
      <a routerLink="/mfe1" routerLinkActive="active" (click)="closeSidebar()">
        <span class="icon" aria-hidden="true">🧩</span>
        <span>Micro Frontend 1</span>
      </a>
    </nav>
  </aside>

  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>

  <main class="content">
    <router-outlet />
  </main>
</div>
